# ============================================================
#  Attribute lore format
# ============================================================
#
# Prints one line per attribute declared in the item's `attribute:` section.
# Attach it with `sertraline: lore-format: attribute`.
#
# Lines are generated by Sertraline (name + value), so the item config stays clean:
#   attribute:
#     attack_damage: 100
#     attack_speed: 100%
# renders as
#   | Attack Damage +100
#   | Attack Speed +100%
#
# overwrite: false -> keep the item's own lore and append the attribute lines to it.
attribute:
  settings:
    overwrite: false
    visual: false
    auto-skip-blank: true
  elements:
    # List value: one element = one lore line, {value} is the already formatted line.
    - key: "attribute-lore:lines"
      content: "{value}"

# Hand-styled alternative: reference single attributes by id. Use {value} rather than
# {plus}{value} — the plus/minus helper only signs plain numbers, so "50%" would lose its
# sign anyway. The `attribute` format above already handles signs, % and x correctly.
attribute_styled:
  settings:
    overwrite: false
    visual: false
    auto-skip-blank: true
  elements:
    - content: "<#aabbcc>--------------------"
    - key: "attribute:attack_damage"
      content: "<!i><gray>Attack Damage <white>{value}"
    - key: "attribute:attack_speed"
      content: "<!i><gray>Attack Speed <white>{value}"
    - key: "attribute:crit_chance"
      content: "<!i><gray>Crit Chance <white>{value}"
    - content: "<#aabbcc>--------------------"
