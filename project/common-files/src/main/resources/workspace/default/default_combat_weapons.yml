# 默认战斗武器 / Default combat weapons
# Main hand only. Requires attributes/default.yml and global-listeners/default-combat.yml.

combat_guard_sword:
  attribute-modifiers:
    - type: sertraline:physical_damage
      id: sertraline:combat_guard_sword/physical_damage
      amount: 5
      operation: minecraft:add_value
      slot: mainhand
    - type: sertraline:physical_defense
      id: sertraline:combat_guard_sword/physical_defense
      amount: 10
      operation: minecraft:add_value
      slot: mainhand
  xbuilder:
    name: "<!i><aqua>守卫长剑"
    material: IRON_SWORD
    lore:
      - "<!i><gray>稳健的近战武器。"
      - "<!i><gray>附加物理伤害 <white>+5"
      - "<!i><gray>物理防御 <white>+10"

