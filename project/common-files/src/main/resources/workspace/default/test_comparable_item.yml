# ─────────────────────────────────────────────────────────────
#  Two English example items using the comparison lore format
#  (see lore-formats/compare_example.yml -> comparable_format).
#
#  When comparable_sword's lore is (re)rendered, it compares its own
#  attribute values against the item the player currently has equipped
#  in the slot named by sertraline.compare-path.
#
#  sertraline.compare-path  = the target EQUIPMENT SLOT (e.g. MAIN_HAND,
#                             OFF_HAND, HEAD, CHEST, ...). "MAIN_HAND" / "HAND"
#                             both mean the main hand. There is NO template
#                             reference item — the target is whatever is in
#                             that slot on the player right now.
#
#  The switch format comparable_format routes to comparable_attribute when the
#  player's loreMode == 0 (toggled via the F-key / offhand_meta_toggle). Each
#  attribute line reads the CURRENT item's value from the mmo: path (e.g.
#  mmo:ATTACK_DAMAGE) and the target's value from the SAME path on the equipped
#  item, then the `simple_example` compare group maps diff = current - compare
#  to a result string (first matching condition wins, top to bottom):
#    diff == 0          -> "equal"
#    diff >  10         -> "very_high"
#    diff == 10         -> "high"     (only exactly 10 reaches GREATER_THAN 0)
#    any other diff     -> "very_low" (LESS_THAN 10 catches everything else)
#  If a side is missing entirely, the LOST/NEW branches fire instead.
#
#  Example: with comparable_sword_2 (attack_damage 10, attack_speed 5) equipped
#  in the player's MAIN_HAND while comparable_sword (20 / 7) is being rendered:
#    attack_damage  20 vs 10  -> diff 10  -> "high"
#    attack_speed    7 vs  5  -> diff  2  -> "very_low"
# ─────────────────────────────────────────────────────────────
comparable_sword:
  sertraline:
    tier: S
    lore-format: comparable_format
    compare-path: MAIN_HAND
    vals:
      toggleable_mark: true
  mmo:
    attack_damage: 20
    attack_speed: 7
  xbuilder:
    name: "<!i><#ff6936>comparable Sword"
    material: DIAMOND_SWORD
    lore: |
      <!i><dark_gray><strikethrough>-------------------------
      <!i><gray>Comparing against: <aqua>your MAIN HAND item
      <!i><gray><i>Each attribute line shows its value and, if a target item
      <!i><gray><i>is equipped in that slot, the raw difference vs it.
      <!i><dark_gray><strikethrough>-------------------------
comparable_sword_2:
  sertraline:
    tier: S
    lore-format: comparable_format
    compare-path: MAIN_HAND
    vals:
      toggleable_mark: true
  mmo:
    attack_damage: 10
    attack_speed: 5
  xbuilder:
    name: "<!i><#66CCFF>SECOND comparable Sword"
    material: IRON_SWORD
    lore: |
      <!i><dark_gray><strikethrough>-------------------------
      <!i><gray>
      <!i><dark_gray><strikethrough>-------------------------