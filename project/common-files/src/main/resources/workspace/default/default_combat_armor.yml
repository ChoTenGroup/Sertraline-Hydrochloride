# 默认战斗装备 / Default combat equipment
# Bonuses apply only in the listed slot. No implicit set bonus.

combat_sentinel_helmet:
  attribute-modifiers:
    - type: sertraline:physical_defense
      id: sertraline:combat_sentinel_helmet/physical_defense
      amount: 20
      operation: minecraft:add_value
      slot: head
    - type: sertraline:magic_defense
      id: sertraline:combat_sentinel_helmet/magic_defense
      amount: 10
      operation: minecraft:add_value
      slot: head
  xbuilder:
    name: "<!i><aqua>哨卫头盔"
    material: IRON_HELMET
    lore:
      - "<!i><gray>仅在对应装备栏生效。"
      - "<!i><gray>物理防御 <white>+20"
      - "<!i><gray>魔法防御 <white>+10"

