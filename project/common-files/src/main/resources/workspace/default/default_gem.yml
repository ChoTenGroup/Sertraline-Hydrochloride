# ============================================================
# 宝石系统示例 Gem system examples
#
# 槽位写在物品的 sertraline:gem-slots 下，宝石词条写在宝石物品的 sertraline:gem 下。
# Sockets are declared under sertraline:gem-slots of the item, gem behaviour
# under sertraline:gem of the gem item.
# 槽位 name/desc 优先取物品配置；省略时尝试语言键 Gem_Slot_<slotId>_Name / _Desc。
# Socket name/desc come from the item first; if omitted, the plugin checks
# Gem_Slot_<slotId>_Name / _Desc language nodes.
#
# 镶嵌方式 How to socket:
#   - 手持宝石点武器 / Hold a gem on the cursor and click the weapon
#   - /sertralinegem socket <slotId> [gemId]   （gemId 省略时取副手 / falls back to the off hand）
# 取下 Remove: /sertralinegem unsocket <slotId>
# 查看 List:   /sertralinegem list
#
# 点击镶嵌可以在 config.yml 的 gem.interaction.click 下配置（开关 / 点击方式 / 权限），
# 也可以在物品、槽位、宝石上用 click: false 单独禁用；命令与 API 不受影响。
# Click-to-socket is configured under gem.interaction.click in config.yml (enable / types /
# permission) and can be opted out per item, socket or gem with click: false; commands and
# API calls are not affected.
#
# modify-data 的键必须以「命名空间:路径」结尾（下面两种写法等价）：
# Keys of modify-data must resolve to a `namespace:path` item data key — both
# spellings below are equivalent:
#   sertraline: { vars: { atk: "+15" } }      # 嵌套写法 nested
#   "sertraline:vars.atk": "+15"              # 扁平写法 flat
# 值前缀 "+n"/"-n" 表示在现有数值上加减，其他值表示直接设置。
# A "+n"/"-n" prefix adds to the current value; anything else sets it.
# ============================================================

gem_example_sword:
  sertraline:
    tier: C
    vars:
      atk: 100
    gem-slots:
      slot_red:
        name: "<red>Red Socket"
        desc: "<gray>Can apply a red gem."
        gem-color: "red"
      slot_any:
        name: "<light_purple>Prismatic Socket"
        desc: "<gray>Accepts any gem color."
        # gem-color 省略 = 接受任意颜色 omitted = accepts every color
      # 只能通过命令 / API 镶嵌的槽位
      # a socket that only commands / the API may fill
      slot_locked:
        name: "<gray>Locked Socket"
        desc: "<gray>Socketed by a blacksmith only."
        gem-color: ".*"
        click: false
  xbuilder:
    name: "<!i>&cGem Example Sword"
    material: DIAMOND_SWORD
    lore: |
      <!i><gray>Attack: <red>${var:atkAsIn}$
      <!i>${gem-slot:slot_red}$
      <!i>${gem-slot:slot_any}$
      <!i>${gem-slot:slot_locked}$

# ------------------------------------------------------------
# 只能嵌红宝石的武器 A weapon that only takes a ruby
#
# `gem-color: "red"` 是一个正则，只有 color 为 red 的宝石（见下面的
# gem_example_ruby）能进入 ruby_socket；蓝宝石/无色宝石会被拒绝（COLOR_MISMATCH）。
# `gem-color: "red"` is a regex, so only gems whose `color` is `red` (see
# gem_example_ruby) fit ruby_socket; blue or colourless gems are refused.
#
# 红宝石的 modify-data 会给 vars.atk 加 15，所以镶嵌后
# “Attack Power” 会从 120 变成 135，取下后恢复 120。
# The ruby's modify-data adds 15 to vars.atk, so socketing it turns
# "Attack Power" from 120 into 135, and removing it goes back to 120.
# ------------------------------------------------------------
ruby_heart_sword:
  sertraline:
    tier: A
    vars:
      atk: 120
    gem-slots:
      ruby_socket:
        name: "<red>Ruby Socket"
        desc: "<gray>Fits a <red>ruby<gray>."
        gem-color: "red"
  xbuilder:
    name: "<!i><gradient:red:gold>Ruby Heart Sword"
    material: NETHERITE_SWORD
    glow: true
    lore: |
      <!i><#888888>A blade with a single heart-shaped socket,
      <!i><#888888>waiting for a ruby to set it ablaze.
      <!i>
      <!i><gray>Attack Power: <red>${var:atkAsIn}$
      <!i><#888888>Socket a <red>ruby<#888888> to gain <red>+15<#888888> Attack Power.
      <!i>
      <!i>${gem-slot:ruby_socket}$
    attributes:
      ATTACK_DAMAGE:
        amount: 4
        operation: ADD_NUMBER
        slot: HAND
      ATTACK_SPEED:
        amount: 0.5
        operation: ADD_NUMBER
        slot: HAND

gem_example_ruby:
  sertraline:
    gem:
      color: red
      meta:
        note: "A red gem."
      modify-data:
        sertraline:
          vars:
            atk: "+15"
  xbuilder:
    name: "<!i><red>Ruby Gem"
    material: RED_DYE
    lore: |
      <!i><gray>Socket into a <red>red socket<gray>.
      <!i><gray>+15 Attack.

gem_example_sapphire:
  sertraline:
    gem:
      color: blue
      modify-data:
        "sertraline:vars.atk": "+25"
  xbuilder:
    name: "<!i><blue>Sapphire Gem"
    material: LAPIS_LAZULI
    lore: |
      <!i><gray>Socket into a <blue>blue socket<gray>.
      <!i><gray>+25 Attack.

gem_example_plain:
  sertraline:
    gem:
      color: white
      # 这颗宝石只能用命令 / API 镶嵌，点击无效
      # this gem can only be socketed by command / API, not by clicking
      click: false
  xbuilder:
    name: "<!i><white>Plain Gem"
    material: QUARTZ
    lore: |
      <!i><gray>A cosmetic gem: it occupies a socket
      <!i><gray>but grants no stats.
      <!i><gray>Must be socketed by a blacksmith.
