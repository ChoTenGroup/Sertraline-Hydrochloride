# ==============================
# 模板使用示例 (Template Usage Examples)
#
# 核心规则 / Core rule:
#   `arguments` 只是占位符替换字典，模板体里没写 %{xxx} 的地方，传 xxx 参数不会有任何效果。
#   `arguments` is only a substitution dictionary: a parameter does nothing unless the template body
#   references it as %{param}. Passing an unused parameter logs a warning at load time.
# ==============================

# 基本用法：继承模板，仅覆盖 name
# Basic usage: inherit a template, override name only
apprentice_sword:
  $template:
    use: iron_melee
    arguments:
      name: Apprentice Sword
  sertraline:
    tier: C

# 覆盖多个参数
# Multiple argument overrides
knight_longsword:
  $template:
    use: diamond_melee
    arguments:
      damage: 14
      speed: 1.4
      name: Knight Longsword
  sertraline:
    tier: B

# 使用 _ID 自动参数
# Using _ID auto-parameter
flame_sword:
  $template:
    use: basic_melee_weapon
    arguments:
      material: NETHERITE_SWORD
      damage: 16
      name: "Flame Sword of %{_ID}"
  sertraline:
    tier: A

# `$template` 也可以直接写成模板名字符串（等价于 use: xxx）
# `$template` also accepts the template name as a plain string (same as `use: xxx`)
short_hand_sword:
  $template: iron_melee
  sertraline:
    tier: C

# ==============================
# $t 类型转换器示例 (Type ($t) Transformer Examples)
# ==============================

# $t: when — 基于 _ID 的值映射（一个模板按物品 ID 出不同名字）
# $t: when - value mapping based on _ID (one template, different names per item id)
guardian_sword:
  $template:
    use: guardian_weapon
    arguments:
      material: STONE_SWORD
      damage: 10
      speed: 1.6
  sertraline:
    tier: A

# 同一个 when 表达式的另一个分支（分支按 _ID 命中）
# Another branch of the same when expression (the branch matches by _ID)
forest_guardian_sword:
  $template:
    use: guardian_weapon
    arguments:
      material: WOODEN_SWORD
      damage: 10
      speed: 1.6
  sertraline:
    tier: A

# $t: 大小写转换
# $t: upper/lower case
titan_sword:
  $template:
    use: basic_melee_weapon
    arguments:
      material: DIAMOND_SWORD
      damage: 25
      speed: 1.2
      name:
        $t:
          type: upper
          value: "titan sword"
  sertraline:
    tier: S

hunter_knife:
  $template:
    use: basic_melee_weapon
    arguments:
      material: IRON_SWORD
      damage: 7
      speed: 2.2
      name:
        $t:
          type: lower
          value: "HUNTER KNIFE"
  sertraline:
    tier: B

# $t: 条件判断
# $t: condition
# 注意：`$t` 按声明顺序求值，只能看到它**之前**声明的参数（以及 _ID）。
# Note: `$t` is evaluated in declaration order and only sees arguments declared before it (plus _ID).
# 所以这里 `enchanted` 必须写在 `name` 之前。
# That is why `enchanted` must be declared before `name` here.
magic_staff:
  $template:
    use: basic_melee_weapon
    arguments:
      material: STICK
      enchanted: "true"
      damage:
        $t:
          type: condition
          condition: "true"
          true: "12"
          false: "6"
      speed: 1.0
      name:
        $t:
          type: condition
          condition: "%{enchanted?:false}"
          true: "&dEnchanted Magic Staff"
          false: "&5Magic Staff"
  sertraline:
    tier: A

# ==============================
# $c 类型转换示例 (Cast ($c) Type Converter Examples)
#
# `$c` 转换的是"已有来源"的值：要么是同一条目里 `$t` 的结果，要么是从外层模板继承来的同名参数。
# 单独写 `$c` 而没有来源时没有东西可转换，参数会被丢弃并输出一条 warning。
# `$c` converts an existing value: either the `$t` result in the same value, or a same-named argument
# inherited from an enclosing template. `$c` without a source has nothing to convert; the parameter is
# dropped with a warning.
# ==============================

# $t + $c 组合（先转换后转类型）：对 $t 的输出做取整
# $t + $c combined (transform then cast): round the $t output
precision_blade:
  $template:
    use: basic_melee_weapon
    arguments:
      material: IRON_SWORD
      damage:
        $t:
          type: upper
          value: "12.4"
        $c:
          type: int
          round: ceil
      speed: 1.6
      name: Precision Blade
  sertraline:
    tier: B

# $c 可通过 value 直接指定要转换的值。
# Use value to supply a converter input directly.
light_dagger:
  $template:
    use: basic_melee_weapon
    arguments:
      material: IRON_SWORD
      damage: 5
      speed:
        $c:
          type: double
          value: "1.55"
      name: Light Dagger
  sertraline:
    tier: C

# $c: string 大小写转换（同样需要来源：这里 $t 先产出文本，再 $c 改成大写）
# $c: string with case conversion (also needs a source: $t produces the text, $c uppercases it)
echo_helmet:
  $template:
    use: basic_helmet
    arguments:
      material: IRON_HELMET
      armor: 3
      name:
        $t:
          type: upper
          value: "echo helmet"
        $c:
          type: string
          case: uppercase
  sertraline:
    tier: B

# $t + $c 组合（先转换后转类型）
# $t + $c combined (transform then cast)
shadow_blade:
  $template:
    use: basic_melee_weapon
    arguments:
      material: NETHERITE_SWORD
      damage:
        $t:
          type: when
          source: "%{_ID}"
          when:
            shadow_blade: "15.7"
          fallback: "10"
        $c:
          type: int
          round: ceil
      speed: 1.8
      name:
        $t:
          type: upper
          value: "shadow blade"
        $c:
          type: string
          case: upper
  sertraline:
    tier: S

# ==============================
# 合并规则示例 (Merge Behavior Examples)
#
# 条目自己的字段会**递归**合并到模板结果上：只写 lore 不会丢掉模板的 material/name/attributes。
# 列表默认是"追加"，写 `$list-mode: replace` 则改为"替换"。
# An entry's own fields are merged **recursively** over the template: setting only `lore` keeps the
# template's material/name/attributes. Lists append by default; `$list-mode: replace` replaces them.
# ==============================

# 在模板 lore 之后追加一行
# Append one extra lore line after the template's lore
annotated_blade:
  $template:
    use: basic_melee_weapon
    arguments:
      material: IRON_SWORD
      name: Annotated Blade
  xbuilder:
    lore:
      - "<gray>Crafted by example."
  sertraline:
    tier: C

# 完全替换 lore（不保留模板默认 lore）
# Replace the lore entirely (template default lore is not kept)
clean_blade:
  $template:
    use: basic_melee_weapon
    arguments:
      material: GOLDEN_SWORD
      name: Clean Blade
  $list-mode: replace
  xbuilder:
    lore:
      - "<gold>No template lore here."
  sertraline:
    tier: B

# ==============================
# $t: self_increase（自增计数器）
# $t: self_increase (incrementing counter)
# 每次展开取得一个序号。同一次展开中的所有引用共享该序号，配置重载会重置计数。
# Each expansion receives one number shared by all references. Reload starts a new sequence.
# ==============================
numbered_token:
  $template:
    use: basic_consumable
    arguments:
      material: PAPER
      number:
        $t:
          type: self_increase
          from: 1
          to: 999
          step: 1
          step_interval: 1
      name: "Token #%{number}"
